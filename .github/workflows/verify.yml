name: Verify UniCircle

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/unicircle-unit-tests
      MONGODB_DB_NAME: UniCircleUnitTests
      UNIVERSITY_NAME: Southeast University
      INITIAL_APPROVED_DOMAIN: seu.edu.bd
      APP_BASE_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173
      CSRF_SECRET: ci-only-csrf-secret-with-at-least-32-characters
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openapi-spec-validator==0.7.2
      - run: python -m openapi_spec_validator openapi.yaml
      - run: python scripts/check_contract.py
